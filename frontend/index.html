<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GreenPath | Login
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<main class="login-page">

<section class="login-card">


    <div class="logo">

        <div class="logo-leaf">
            🌿
        </div>

        <h1>
            GreenPath
        </h1>

    </div>


    <p class="tagline">
        Your simple path to every service
    </p>


    <h2>
        Welcome Back
    </h2>

    <p class="subtitle">
        Login to continue your journey
    </p>


    <form id="loginForm">


        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <div class="input-box">

                <span class="input-icon">
                    ☎
                </span>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button
                    type="button"
                    id="showPassword"
                    class="eye-button"
                >
                    👁
                </button>

            </div>

        </div>


        <div class="forgot-container">

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="login-button"
        >
            Login
        </button>


        <p id="loginMessage"></p>


    </form>


    <div class="create-account">

        <p>
            New to GreenPath?
        </p>

        <a href="signup.html">
            Create Account
        </a>

    </div>


</section>

</main>


<script src="js/login.js"></script>

</body>

</html>
