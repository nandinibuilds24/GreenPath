<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GreenPath | Forgot Password
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<main class="login-page">

<section class="login-card">


    <div class="logo">

        <div class="logo-leaf">
            🌿
        </div>

        <h1>
            GreenPath
        </h1>

    </div>


    <p class="tagline">
        Your simple path to every service
    </p>


    <h2>
        Forgot Password?
    </h2>


    <p class="subtitle">
        Enter your registered email address
    </p>


    <form id="forgotPasswordForm">

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <div class="input-box">

                <span class="input-icon">
                    ✉
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
        >
            Send OTP
        </button>


        <p id="forgotMessage"></p>


    </form>


    <div class="back-login">

        <a href="index.html">
            ← Back to Login
        </a>

    </div>


</section>

</main>


<script src="js/forgot-password.js"></script>

</body>

</html>
