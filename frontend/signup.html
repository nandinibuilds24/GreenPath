<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GreenPath | Create Account
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<main class="login-page">

<section class="login-card">


    <div class="logo">

        <div class="logo-leaf">
            🌿
        </div>

        <h1>
            GreenPath
        </h1>

    </div>


    <p class="tagline">
        Your simple path to every service
    </p>


    <h2>
        Create Account
    </h2>


    <p class="subtitle">
        Create your GreenPath profile
    </p>


    <form id="signupForm">


        <div class="form-group">

            <label for="name">
                Full Name
            </label>

            <div class="input-box">

                <span class="input-icon">
                    ♙
                </span>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="phone">
                Phone Number
            </label>

            <div class="input-box">

                <span class="input-icon">
                    ☎
                </span>

                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <div class="input-box">

                <span class="input-icon">
                    ✉
                </span>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="password">
                Create Password
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
        >
            Create Account
        </button>


        <p id="signupMessage"></p>


    </form>


    <div class="back-login">

        <a href="index.html">
            ← Back to Login
        </a>

    </div>


</section>

</main>


<script src="js/signup.js"></script>

</body>

</html>
