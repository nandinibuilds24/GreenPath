<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        GreenPath | Reset Password
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<main class="login-page">

<section class="login-card">


    <div class="logo">

        <div class="logo-leaf">
            🌿
        </div>

        <h1>
            GreenPath
        </h1>

    </div>


    <p class="tagline">
        Your simple path to every service
    </p>


    <h2>
        Reset Password
    </h2>


    <p class="subtitle">
        Create a new password for your account
    </p>


    <form id="resetPasswordForm">


        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
        >
            Reset Password
        </button>


        <p id="resetMessage"></p>


    </form>


</section>

</main>


<script src="js/reset-password.js"></script>

</body>

</html>
