<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GreenPath | Profile</title>

    <link
        rel="stylesheet"
        href="css/profile.css"
    >

</head>


<body>

<main class="profile-page">

    <section class="profile-card">

        <div class="profile-top">

            <div class="profile-avatar">
                👤
            </div>

            <h1 id="profileName">
                User
            </h1>

            <p>
                GreenPath Account
            </p>

        </div>


        <div class="profile-divider"></div>


        <section class="account-section">

            <h2>
                Account Information
            </h2>


            <div class="detail-list">


                <div class="detail-item">

                    <div class="detail-label">
                        Full Name
                    </div>

                    <div
                        class="detail-value"
                        id="fullName"
                    >
                        Loading...
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Phone Number
                    </div>

                    <div
                        class="detail-value"
                        id="phoneNumber"
                    >
                        Loading...
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Email Address
                    </div>

                    <div
                        class="detail-value"
                        id="emailAddress"
                    >
                        Loading...
                    </div>

                </div>


                <div class="detail-item">

                    <div class="detail-label">
                        Joined GreenPath
                    </div>

                    <div
                        class="detail-value"
                        id="joinedDate"
                    >
                        Loading...
                    </div>

                </div>


            </div>

        </section>


        <div class="profile-actions">

            <button
                type="button"
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </section>

</main>


<script src="js/profile.js"></script>

</body>

</html>
